name: Website checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      ASTRO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Report production deployment prerequisites
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ && "$BASE_SHA" != 0000000000000000000000000000000000000000 ]]
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          python3 deploy/preflight.py "$BASE_SHA" "$HEAD_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run setup:local
      - run: npm run check
      - run: npm test
      - run: npm run build:preview
      - run: SITE_MODE=preview npm run check:output
      - run: npm run build:cms
      - run: npx playwright install --with-deps chromium
      - run: npm run test:cms
      - run: npm run test:dev
      - run: npm run test:browser
      - run: npm audit --omit=dev --audit-level=high
      - name: Check automatic deployment scripts
        run: |
          python3 tests/deploy-auto.test.py
          python3 tests/deploy-actions.test.py
          python3 tests/deploy-preflight.test.py
          bash -n deploy/deploy.sh
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure
          path: test-results/
          retention-days: 7
